function applicable(items,type){return items.filter(i=>type!=='government'||!i.privateOnly)}
function summary(items,answers){
 const rated=items.filter(i=>typeof answers[i.id]?.score==='number'&&Number.isFinite(answers[i.id].score));
 return {total:items.length,completed:rated.length,coverage:items.length?rated.length/items.length*100:0,score:rated.length?rated.reduce((n,i)=>n+answers[i.id].score,0)/rated.length:null,complete:rated.length===items.length&&items.length>0};
}
function level(score){return score===null?'لم يُقيّم':score>=90?'التميز':score>=75?'التقدم':score>=50?'الانطلاق':'التهيئة'}
function gaps(items,answers,target){return items.filter(i=>typeof answers[i.id]?.score==='number'&&answers[i.id].score<target).map(i=>({...i,score:answers[i.id].score,gap:target-answers[i.id].score})).sort((a,b)=>b.gap-a.gap)}
function validateState(s,items){
 if(!s||s.version!==1||!s.school||typeof s.school.name!=='string'||!['government','private','international'].includes(s.school.type)||!Number.isFinite(s.target)||s.target<0||s.target>100||!s.answers||!Array.isArray(s.tasks)||!Array.isArray(s.team)||!Array.isArray(s.cycles))throw Error('ملف النسخة الاحتياطية غير متوافق');
 for(const [id,a]of Object.entries(s.answers))if(!items.some(i=>i.id===id)||!a||!(a.score===null||(Number.isFinite(a.score)&&a.score>=0&&a.score<=100))||typeof a.notes!=='string')throw Error('تقييمات غير صالحة');
 for(const t of s.tasks)if(!t||typeof t.id!=='string'||typeof t.title!=='string'||typeof t.owner!=='string'||typeof t.date!=='string'||!['todo','doing','done'].includes(t.status))throw Error('مهام غير صالحة');
 for(const t of s.team)if(!t||typeof t.id!=='string'||typeof t.name!=='string'||typeof t.role!=='string')throw Error('فريق غير صالح');
 for(const c of s.cycles)if(!c||typeof c.name!=='string'||!Number.isFinite(c.score)||!Number.isFinite(c.total)||typeof c.date!=='string')throw Error('دورات غير صالحة');
 return s;
}

const tag=(text,style='')=>`<span class="tag ${style}">${esc(text)}</span>`;
function button(text,action,style='',attrs=''){return `<button class="btn ${style}" data-action="${action}" ${attrs}>${text}</button>`}
function heading(title,sub,actions=''){return `<div class="page-heading"><div><p class="eyebrow">مِعْيَار / ${esc(nav.find(n=>n[0]===page)?.[2]||'')}</p><h1>${title}</h1><p class="muted">${sub}</p></div><div class="actions no-print">${actions}</div></div>`}
function stats(){let m=metrics(),f=finding(),done=state.tasks.filter(t=>t.status==='done').length;return `<div class="stats"><div class="stat"><div class="stat-top">متوسط التقدير الداخلي <span class="stat-icon">◉</span></div><div class="stat-value">${pct(m.score)}</div><div class="stat-note">${m.complete?'اكتمل إدخال التقديرات':'نتيجة جزئية · '+num(m.completed)+' من '+num(m.total)} · استرشادي</div></div><div class="stat"><div class="stat-top">المؤشرات المقيّمة <span class="stat-icon">▤</span></div><div class="stat-value">${num(m.completed)} <small>/ ${num(m.total)}</small></div><div class="stat-note">${pct(m.coverage)} من المؤشرات المنطبقة</div></div><div class="stat"><div class="stat-top">فرص التحسين <span class="stat-icon">↗</span></div><div class="stat-value">${num(f.length)} <small>مؤشرًا</small></div><div class="stat-note">أقل من المستهدف الداخلي ${pct(state.target)}</div></div><div class="stat"><div class="stat-top">إنجاز خطة التحسين <span class="stat-icon">✓</span></div><div class="stat-value">${state.tasks.length?pct(done/state.tasks.length*100):'—'}</div><div class="stat-note">${num(done)} إجراءات مكتملة من ${num(state.tasks.length)}</div></div></div>`}
function bars(){return domains.map((d,i)=>{const m=summary(eligible().filter(x=>x.domain===i+1),state.answers);return `<div class="domain-row"><span>${d}</span><div class="track"><div class="fill" style="width:${m.score??0}%"></div></div><b>${pct(m.score)}</b></div>`}).join('')}
function gapsTable(limit=999){const rows=finding().slice(0,limit);return rows.length?`<div class="table-wrap"><table><thead><tr><th>المؤشر / المجال</th><th>التقدير</th><th>الفجوة</th><th>الأولوية الداخلية</th><th class="no-print">الإجراء</th></tr></thead><tbody>${rows.map(i=>`<tr><td class="table-title"><code>${i.id}</code><div>${esc(i.text)}</div><small class="muted">${domains[i.domain-1]} · ${esc(i.standard)}</small></td><td>${pct(i.score)}</td><td>${num(i.gap)} نقطة</td><td>${tag(i.gap>=30?'مرتفعة':i.gap>=15?'متوسطة':'منخفضة',i.gap>=30?'red':i.gap>=15?'amber':'')}</td><td class="no-print"><button class="link-btn" data-action="add-task" data-id="${i.id}">+ إجراء تحسين</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${metrics().completed?'لا توجد فجوات ضمن التقديرات المدخلة مقارنة بالمستهدف.':'ابدأ تقييم المؤشرات لتظهر فرص التحسين هنا.'}</div>`}
function dashboard(){let m=metrics();return heading('كل تحسين يبدأ برؤية واضحة.','مرحبًا بك في مساحة '+esc(state.school.name)+' · '+esc(state.school.year),button('↓ تقرير المدرسة','report')+button('+ متابعة التقييم','assess','primary'))+`<div class="hero"><div class="hero-icon">✧</div><div><h2>من التقييم إلى التحسين، في مكان واحد</h2><p>قيّم ممارسات مدرستك، نظّم الشواهد، وحوّل فرص التطوير إلى خطوات قابلة للمتابعة.</p></div>${button(m.completed?'استكمل رحلتك ←':'ابدأ إعداد المدرسة ←',m.completed?'assess':'settings','soft')}</div>`+stats()+`<div class="grid-two"><section class="panel"><div class="panel-head"><div><h2>الأداء حسب المجال</h2><p>متوسط داخلي للمؤشرات المقيّمة فقط · أوزان متساوية</p></div>${tag('٤ مجالات رئيسية')}</div>${bars()}<div class="legend"><span><i></i>التقدير الداخلي الحالي</span><span>المستهدف: ${pct(state.target)}</span><span>غير المقيّم: —</span></div></section><section class="panel"><div class="panel-head"><div><h2>رحلة التقويم الذاتي</h2><p>كل خطوة تقرّبك من صورة أكثر اكتمالًا</p></div><a href="#workflow" class="source-link">التفاصيل ←</a></div><div class="ring-wrap"><div class="ring" style="--progress:${m.coverage}%"><div class="ring-inner"><strong>${pct(m.coverage)}</strong><small>اكتمال إدخال التقديرات</small></div></div><div><h3>${m.complete?'جاهز لمراجعة النتائج':'رحلة التحسين مستمرة'}</h3><p class="muted">${num(m.total-m.completed)} مؤشرًا بانتظار التقييم</p>${tag('الإصدار الثاني · 2026')}</div></div><div class="stage"><span>١. الإعداد والتهيئة</span>${tag(state.team.length>=5?'الفريق مسجل':'تجهيز الفريق',state.team.length>=5?'':'amber')}</div><div class="stage"><span>٢. التنفيذ وجمع الشواهد</span><small>${num(evidence.length)} شاهدًا محفوظًا</small></div><div class="stage"><span>٣. الإغلاق وخطة التحسين</span><small>${num(state.tasks.length)} إجراءات</small></div></section></div><section class="panel"><div class="panel-head"><div><h2>أولويات تستحق اهتمامك</h2><p>الفجوات الأعلى ضمن المؤشرات المقيّمة، وفق المستهدف الداخلي</p></div><a class="source-link" href="#gaps">عرض كل الفجوات ←</a></div>${gapsTable(3)}</section><div class="notice no-print">${state.demo?'أنت تستعرض بيانات افتراضية للتجربة. يمكنك بدء مدرسة جديدة من الإعدادات.':'تُحفظ بياناتك على هذا المتصفح فقط. صدّر نسخة احتياطية دوريًا؛ لا توجد مزامنة أو حسابات مشتركة في هذه النسخة.'} <button class="link-btn" data-action="${state.demo?'settings':'demo'}">${state.demo?'إعداد مدرستي':'استكشف مثالًا تجريبيًا ←'}</button></div>`}
function assessment(){return heading('التقييم الذاتي','مكتبة مؤشرات الهيئة · ٤ مجالات / ١١ معيارًا · '+num(eligible().length)+' مؤشرًا منطبقًا',button('مكتبة الأدلة ↗','sources'))+`<div class="notice">أدخل تقديرًا تشخيصيًا من ٠ إلى ١٠٠ بناءً على الشواهد. هذا إدخال داخلي مباشر، ولا يعيد احتساب نتيجة منصة تميز أو أوزان التقويم الرسمي. المؤشر غير المقيّم يبقى غير مكتمل.</div><div class="toolbar no-print"><input id="search" placeholder="ابحث بالنص أو رمز المؤشر…" aria-label="البحث في المؤشرات" value="${esc(filter.search)}"><select id="domain-filter" aria-label="تصفية المجال" style="width:auto"><option value="">كل المجالات</option>${domains.map((d,i)=>`<option value="${i+1}" ${filter.domain==i+1?'selected':''}>${d}</option>`).join('')}</select><select id="status-filter" aria-label="تصفية الحالة" style="width:auto"><option value="">كل الحالات</option><option value="missing" ${filter.status==='missing'?'selected':''}>غير مقيّم</option><option value="rated" ${filter.status==='rated'?'selected':''}>مقيّم</option></select></div><div id="indicator-list">${indicatorList()}</div>`}
function indicatorList(){const found=eligible().filter(i=>(!filter.domain||i.domain==filter.domain)&&(!filter.search||`${i.id} ${i.text} ${i.standard}`.includes(filter.search))&&(!filter.status||(filter.status==='missing'?state.answers[i.id]?.score==null:state.answers[i.id]?.score!=null)));return found.length?found.map(i=>{const a=state.answers[i.id],files=evidenceFor(i.id);return `<article class="indicator"><div class="indicator-top"><div><code>${i.id}</code> <span class="muted"> · ${domains[i.domain-1]} / ${esc(i.standard)}</span></div>${tag(a?.score!=null?'مقيّم · '+pct(a.score):'غير مقيّم',a?.score!=null?'':'gray')}</div><h3>${esc(i.text)}</h3><div class="indicator-bottom"><a class="source-link" href="sources/standards.pdf#page=${i.page}" target="_blank" rel="noopener">وثيقة الهيئة، الإصدار الثاني 2026 · ص ${num(i.page)} ↗</a><div class="actions"><span class="muted">${num(files.length)} شواهد</span>${button('تقييم المؤشر ←','edit-indicator','',`data-id="${i.id}"`)}</div></div></article>`}).join(''):'<div class="empty">لا توجد مؤشرات مطابقة للبحث.</div>'}
function evidencePage(){return heading('شواهد منظّمة، تقييم أوثق.','اربط كل شاهد بمؤشره، وسجّل حالة المراجعة وملاحظات التحقق.',button('+ إضافة شاهد','upload','primary'))+`<div class="notice">الملفات محفوظة داخل هذا المتصفح باستخدام IndexedDB. حالات المراجعة سجلات محلية، ولا تمثل اعتمادًا من مراجع مستقل.</div><section class="panel"><div class="panel-head"><h2>مكتبة الشواهد</h2>${tag(num(evidence.length)+' ملفات')}</div>${evidence.length?`<div class="table-wrap"><table><thead><tr><th>الشاهد</th><th>المؤشر</th><th>المراجعة</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>${evidence.map(f=>`<tr><td>${esc(f.name)}<div class="muted">${num(f.size/1024)} كيلوبايت · ${esc(f.note||'دون ملاحظات')}</div></td><td><code>${esc(f.indicator)}</code></td><td>${tag(f.status==='verified'?'تم التحقق محليًا':f.status==='rejected'?'يحتاج استكمالًا':'بانتظار المراجعة',f.status==='verified'?'':'amber')}</td><td>${esc(f.date)}</td><td><button class="link-btn" data-action="download-file" data-id="${f.id}">تنزيل</button> <button class="link-btn" data-action="review-file" data-id="${f.id}">مراجعة</button> <button class="link-btn" data-action="delete-file" data-id="${f.id}">حذف</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">مكتبة الشواهد جاهزة. أضف أول وثيقة واربطها بمؤشر.</div>'}</section>`}
function gapsPage(){return heading('حوّل الفجوات إلى فرص.','الفرق بين المستهدف الداخلي والتقدير المدخل، بالنقاط المئوية.')+stats()+`<div class="notice">ترتيب الفجوات حساب داخلي: الفجوة = الحد الأعلى بين صفر و(المستهدف − التقدير). الأولوية مرتفعة عند ٣٠ نقطة، ومتوسطة عند ١٥ نقطة؛ هذه حدود تنظيمية مقترحة وليست محكات رسمية. الشواهد مؤشر ثقة منفصل عن الدرجة.</div><section class="panel"><div class="panel-head"><h2>فرص التحسين حسب الفجوة</h2><a href="#settings" class="source-link">تعديل المستهدف ${pct(state.target)} ←</a></div>${gapsTable()}</section>`}
function improvement(){return heading('خطة التحسين المدرسي','إجراءات واضحة، ومسؤوليات محددة، وأثر يمكن متابعته.',button('+ إجراء جديد','add-task','primary'))+`<section class="panel"><div class="panel-head"><h2>متابعة التنفيذ</h2>${tag(num(state.tasks.filter(t=>t.status==='done').length)+' / '+num(state.tasks.length)+' مكتمل')}</div>${state.tasks.length?state.tasks.map(t=>`<div class="task"><div class="task-body"><h3>${esc(t.title)}</h3><p>${t.indicator?'<code>'+esc(t.indicator)+'</code> · ':''}${esc(t.owner||'لم يحدد المسؤول')} · الاستحقاق: ${esc(t.date||'غير محدد')} ${t.date&&t.date<today()&&t.status!=='done'?tag('متأخر','red'):''}</p><p>دليل الإنجاز: ${esc(t.proof||'غير محدد')} · قياس الأثر: ${esc(t.impact||'غير محدد')}</p></div><select aria-label="حالة الإجراء" data-task-status="${t.id}"><option value="todo" ${t.status==='todo'?'selected':''}>لم يبدأ</option><option value="doing" ${t.status==='doing'?'selected':''}>قيد التنفيذ</option><option value="done" ${t.status==='done'?'selected':''}>مكتمل</option></select><button class="link-btn" data-action="edit-task" data-id="${t.id}">تعديل</button><button class="link-btn" data-action="delete-task" data-id="${t.id}">حذف</button></div>`).join(''):'<div class="empty">أضف إجراءً أو انتقل لتحليل الفجوات لإنشاء إجراء مرتبط بمؤشر.</div>'}</section>`}
const steps=[['team','تشكيل فريق التقويم الذاتي','مدير المدرسة رئيسًا وأربعة معلمين؛ فريق مستقل لكل مرحلة عند تعدد المراحل.'],['training','تدريب الفريق والاطلاع على المعايير','فهم الأدوات والإجراءات وتحديد الأدوار والمسؤوليات.'],['plan','إعداد خطة التقويم الذاتي','الأهداف، المسؤوليات، الجدول الزمني، ومؤشرات الإنجاز.'],['data','جمع بيانات المدرسة ووثائقها','بيانات المتعلمين والمعلمين والمبنى ونتائج الدورات السابقة.'],['tools','تنفيذ أدوات التقويم وجمع الشواهد','الاستبانات والمقابلات والملاحظات وتحليل الوثائق ونتائج الاختبارات.'],['review','مراجعة اكتمال البيانات وتحليل النتائج','التحقق من الشواهد وتحديد نقاط القوة وفرص التحسين.'],['close','إعداد خطة التحسين والمتابعة','الإغلاق الداخلي ومتابعة التنفيذ وقياس الأثر.']];
function workflow(){return heading('فريق واحد، رحلة مشتركة.','الإعداد والتهيئة ← التنفيذ ← الإغلاق · الدليل الإجرائي للهيئة، ص ٩–١٣.',button('+ عضو في الفريق','add-member','primary'))+`<div class="grid-two"><section class="panel"><div class="panel-head"><h2>قائمة الجاهزية والمتابعة</h2><a class="source-link" href="sources/procedure.pdf#page=11" target="_blank" rel="noopener">مرجع الإجراءات ↗</a></div><div class="step-list">${steps.map(([id,title,sub])=>`<label class="step-item"><input type="checkbox" data-step="${id}" ${state.steps[id]?'checked':''}><span>${title}<small>${sub}</small></span></label>`).join('')}</div></section><section class="panel"><div class="panel-head"><h2>فريق المدرسة</h2>${tag(num(state.team.length)+' أعضاء')}</div>${state.team.length?state.team.map(m=>`<div class="task"><span class="avatar">${esc(m.name.slice(0,1))}</span><div class="task-body"><h3>${esc(m.name)}</h3><p>${esc(m.role)}</p></div><button class="link-btn" data-action="delete-member" data-id="${m.id}">حذف</button></div>`).join(''):'<div class="empty">سجّل رئيس الفريق والأعضاء.</div>'}<p class="muted" style="margin-top:20px">هذا سجل لتنظيم الفريق؛ دعوات الدخول وصلاحيات الحسابات ستتاح عند ربط النسخة بالخادم.</p></section></div>`}
function reports(){const m=metrics();return heading('صورة موثّقة لمسار التحسين.','تقرير داخلي عربي قابل للطباعة أو الحفظ بصيغة PDF من نافذة الطباعة.',button('↓ نسخة احتياطية','export')+button('حفظ لقطة دورة','snapshot')+button('طباعة / PDF','print','primary'))+`<section class="panel"><div class="report-head"><p class="eyebrow">مِعْيَار · تقرير تشخيصي داخلي</p><h2>${esc(state.school.name)}</h2><div class="report-meta"><span>${esc(state.school.year)}</span><span>${esc(state.school.stage)}</span><span>${today()}</span><span>${state.demo?'بيانات افتراضية':'بيانات مدخلة من المدرسة'}</span></div></div><div class="notice">النتائج استرشادية وجزئية ما لم يكتمل إدخال جميع المؤشرات. المتوسط البسيط للمؤشرات المقيّمة لا يمثل نتيجة التقويم الرسمية ولا يمنح اعتمادًا. اكتمال الإدخال: ${pct(m.coverage)}.</div>${stats()}<h3>الأداء حسب المجال</h3>${bars()}<p class="muted">تغطية الشواهد: ${num(eligible().filter(i=>evidenceFor(i.id).length).length)} من ${num(m.total)} مؤشرًا. ملفات تحقق منها محليًا: ${num(evidence.filter(f=>f.status==='verified').length)}.</p><h3 style="margin-top:25px">الفجوات والإجراءات المقترحة</h3>${gapsTable()}<h3 style="margin-top:25px">خطة التحسين</h3>${state.tasks.length?`<table><thead><tr><th>الإجراء</th><th>المسؤول</th><th>الاستحقاق</th><th>الحالة</th></tr></thead><tbody>${state.tasks.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.owner)}</td><td>${esc(t.date)}</td><td>${{todo:'لم يبدأ',doing:'قيد التنفيذ',done:'مكتمل'}[t.status]}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">لا توجد إجراءات مسجلة.</p>'}<p class="muted">مرجع المؤشرات: وثيقة الهيئة، الإصدار الثاني 2026، ص ١١–١٤. منهجية المتوسط والأولوية داخلية موضحة في شاشة الأدلة.</p></section><section class="panel"><div class="panel-head"><h2>سجل لقطات الدورات</h2>${tag('محفوظ محليًا')}</div>${state.cycles.length?`<table><thead><tr><th>الدورة</th><th>التاريخ</th><th>المتوسط الداخلي</th><th>عدد المؤشرات</th></tr></thead><tbody>${state.cycles.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.date)}</td><td>${pct(c.score)}</td><td>${num(c.total)}</td></tr>`).join('')}</tbody></table><p class="muted">اللقطات تحفظ نسخة من التقديرات ونوع المدرسة والمنهجية. المقارنة صالحة عند تطابق النوع والإطار؛ لا تُستنتج مقارنة مباشرة بين نماذج مختلفة.</p>`:'<div class="empty">بعد اكتمال إدخال التقديرات يمكنك حفظ لقطة للرجوع إليها لاحقًا.</div>'}</section>`}
function sourcesPage(){return heading('مرجعية واضحة لكل قرار.','الأدلة الأربعة المرفقة محفوظة مع المشروع، ويمكن فتحها والرجوع إلى صفحاتها.')+`<section class="panel"><div class="panel-head"><h2>مكتبة المراجع</h2>${tag('٤ وثائق')}</div>${references.sort((a,b)=>['standards','procedure','asir','hail'].indexOf(a.id)-['standards','procedure','asir','hail'].indexOf(b.id)).map(r=>`<div class="reference"><span class="file-icon">PDF</span><div><h3>${esc(r.name)}</h3><p>${r.id==='standards'?'المرجع الأساسي للنصوص والرموز · ٤ مجالات، ١١ معيارًا، ٤٩ / ٥٢ مؤشرًا.':r.id==='procedure'?'إجراءات الفريق ومراحل التقويم والأدوات ومستويات الأداء.':'مرجع مساعد لتفسير التطبيق والتحقق من جودة الشواهد وأثرها.'} · ${num(r.pages)} صفحة</p></div><a href="sources/${r.id}.pdf" target="_blank" rel="noopener" class="btn">فتح ↗</a></div>`).join('')}</section><div class="grid-two"><section class="panel"><h2>كيف نحتسب المؤشرات الداخلية؟</h2><p>يُدخل فريق المدرسة تقديرًا تشخيصيًا من ٠ إلى ١٠٠ لكل مؤشر. المتوسط المعروض هو مجموع التقديرات المدخلة مقسومًا على عددها، بأوزان متساوية للمؤشرات.</p><p>غير المقيّم لا يحسب صفرًا ولا يختفي: يظهر في نسبة الاكتمال، وتوصف النتائج بأنها جزئية حتى اكتمال الإدخال. مؤشرات الكادر والملاءة الثلاثة تستبعد تلقائيًا للمدارس الحكومية وفق حاشية ص ١١.</p><p>الفجوة = الحد الأعلى بين صفر و(المستهدف الداخلي − التقدير). لا تُستخرج أوزان رسمية من هذه الوثائق، ولا تحاكي هذه المعادلة محرك الهيئة.</p><p class="muted">النصوص نقلت من ص ١١–١٤ مع تنسيق إملائي، والرموز محفوظة كما تظهر بالوثيقة. لم تُحوّل إرشادات الأدلة المساعدة إلى محكات إلزامية، ولا يُفترض تطابق ترقيمها تلقائيًا.</p></section><section class="panel"><h2>مستويات الأداء في الدليل الإجرائي</h2><p class="muted">ص ١٣ · مرجع وصفي، وليس شهادة للنتائج الداخلية.</p>${[['التميز','٩٠٪ فأعلى'],['التقدم','٧٥٪ إلى أقل من ٩٠٪'],['الانطلاق','٥٠٪ إلى أقل من ٧٥٪'],['التهيئة','أقل من ٥٠٪']].map(([a,b])=>`<div class="stage"><span>${a}</span>${tag(b)}</div>`).join('')}<a class="source-link" href="sources/procedure.pdf#page=13" target="_blank" rel="noopener">الرجوع إلى الصفحة الأصلية ↗</a></section></div><div class="notice">مِعْيَار أداة مستقلة مساندة للتجهيز والتحسين، وليست منصة تميز أو جهة اعتماد. يتطلب الإطلاق التجاري مراجعة حقوق إعادة نشر الأدلة، والتحقق التخصصي من نموذج القياس، وتطبيق حماية بيانات المدارس.</div>`}
function plans(){return heading('باقة تناسب طموح مدرستك.','تصور أولي للاشتراكات السنوية · الأسعار افتراضية لاختبار نموذج العمل.')+`<div class="notice">هذه واجهة عرض للباقات. لا يجري تحصيل مبالغ أو تفعيل اشتراكات في النسخة المحلية؛ يتطلب ذلك حسابات آمنة وخادمًا وربط بوابة دفع.</div><div class="price-grid">${[{name:'الأساسية',price:'١٬٤٩٠',sub:'للمدرسة التي تبدأ رحلتها',features:['مدرسة واحدة','التقييم الذاتي بالمؤشرات','خطة تحسين وتقارير أساسية']},{name:'الاحترافية',price:'٣٬٩٩٠',sub:'لفرق الجودة والتحسين المستمر',features:['كل مزايا الأساسية','مراجعة الشواهد والأدوار','دورات ومتابعة متقدمة'],featured:true},{name:'المؤسسية',price:'١٢٬٩٠٠',sub:'للمجمعات والمجموعات التعليمية',features:['إدارة مدارس متعددة','لوحة مركزية وصلاحيات موسعة','تهيئة ودعم مخصص']}].map(p=>`<article class="price ${p.featured?'featured':''}">${tag(p.featured?'للفرق الطموحة':'اشتراك سنوي')}<h3 style="margin-top:20px">مِعْيَار ${p.name}</h3><p class="muted">${p.sub}</p><div class="amount">${p.price} <small class="muted">ر.س / سنة${p.name==='المؤسسية'?' · ابتداءً من':''}</small></div><ul>${p.features.map(f=>`<li>${f}</li>`).join('')}</ul>${button('تفاصيل الإطلاق التجاري','launch-info',p.featured?'primary':'','style="width:100%"')}</article>`).join('')}</div><section class="panel" style="margin-top:22px"><h2>جاهزة للتطوير إلى خدمة اشتراكات</h2><p class="muted">الواجهة مستقلة عن طريقة التخزين. يوضّح ملف خطة الإطلاق المرفق بالمشروع تصميم قاعدة البيانات، وعزل المدارس، والأدوار، والدفع، والاختبارات اللازمة قبل استقبال العملاء.</p></section>`}
function settings(){return heading('هوية مدرستك ومساحة بياناتها','إعدادات محلية لهذه المدرسة على هذا الجهاز.')+`<section class="panel"><form id="settings-form"><div class="form-grid"><div class="field"><label for="school-name">اسم المدرسة</label><input id="school-name" name="name" required maxlength="100" value="${esc(state.school.name)}"></div><div class="field"><label for="school-type">نوع المدرسة</label><select id="school-type" name="type">${[['private','أهلية'],['government','حكومية'],['international','عالمية']].map(([v,t])=>`<option value="${v}" ${state.school.type===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="school-stage">المرحلة</label><select id="school-stage" name="stage">${['ابتدائي','متوسط','ثانوي','مجمع تعليمي'].map(v=>`<option ${state.school.stage===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label for="school-year">العام الدراسي</label><input id="school-year" name="year" maxlength="50" required value="${esc(state.school.year)}"></div><div class="field"><label for="school-manager">مدير / مديرة المدرسة</label><input id="school-manager" name="manager" maxlength="100" value="${esc(state.school.manager)}"></div><div class="field"><label for="school-target">المستهدف الداخلي (٠–١٠٠)</label><input id="school-target" name="target" type="number" min="0" max="100" required value="${state.target}"></div></div><p class="muted">نوع المدرسة يحدد المؤشرات المنطبقة. تُحتفظ بتقديرات المؤشرات الخاصة عند التحويل إلى حكومية، وتُستبعد من الحساب.</p><button class="btn primary" type="submit">حفظ الإعدادات</button></form></section><section class="panel"><div class="panel-head"><div><h2>بياناتك تحت سيطرتك</h2><p>النسخة الاحتياطية تتضمن التقديرات والخطة والشواهد الفعلية. احفظها في مكان خاص.</p></div></div><div class="actions">${button('تصدير نسخة احتياطية','export')}${button('استيراد نسخة احتياطية','import')}${button('تحميل مثال تجريبي','demo')}${button('بدء مدرسة جديدة','reset','danger')}</div><p class="muted">النسخة المحلية لا توفر تسجيل دخول أو عزل مستخدمين. تجنب حفظ بيانات طلاب حساسة على جهاز مشترك. حذف بيانات المتصفح يحذف البيانات المحلية.</p></section><section class="panel"><h2>سجل العمليات المحلي</h2>${state.audit.length?state.audit.slice(0,12).map(a=>`<div class="stage"><span>${esc(a.action)}</span><small>${esc(new Date(a.date).toLocaleString('ar-SA'))}</small></div>`).join(''):'<p class="muted">لم تسجّل عمليات بعد.</p>'}</section>`}
function render(){page=location.hash.slice(1)||'dashboard';if(!nav.some(n=>n[0]===page))page='dashboard';$('#nav').innerHTML=nav.map(([id,icon,label])=>`<a href="#${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="nav-icon">${icon}</span>${label}${id==='gaps'&&finding().length?`<span class="badge-number">${num(finding().length)}</span>`:''}</a>`).join('');$('#breadcrumb').textContent=nav.find(n=>n[0]===page)[2];$('#school-label').textContent=state.school.name;const screens={dashboard,assessment,evidence:evidencePage,gaps:gapsPage,improvement,workflow,reports,sources:sourcesPage,plans,settings};$('#main').innerHTML=screens[page]();document.body.classList.remove('menu-open')}
function modal(title,content){$('#modal-body').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="close" aria-label="إغلاق">×</button></div>${content}`;$('#modal').showModal()}
function close(){$('#modal').close()}
function editIndicator(id){const i=items.find(x=>x.id===id),a=state.answers[id]||{score:null,notes:''};modal('تقييم المؤشر <bdi>'+id+'</bdi>',`<p>${esc(i.text)}</p><p class="muted">${domains[i.domain-1]} / ${esc(i.standard)} · <a href="sources/standards.pdf#page=${i.page}" target="_blank" rel="noopener">مرجع الهيئة ص ${num(i.page)} ↗</a></p>${i.hailPage?`<p class="muted"><a href="sources/hail.pdf#page=${i.hailPage}" target="_blank" rel="noopener">إضاءات التطبيق من دليل حائل · صفحة PDF ${num(i.hailPage)} ↗</a></p>`:''}${i.guidance?`<div class="notice"><strong>إرشاد مساعد للشواهد</strong><p>${esc(i.guidance.text)}</p><a href="sources/asir.pdf#page=${i.guidance.asirPage}" target="_blank" rel="noopener">دليل عسير · ص ${num(i.guidance.asirPage)} ↗</a></div>`:''}<form id="indicator-form" data-id="${id}"><div class="field" style="margin-top:20px"><label for="indicator-score">التقدير الداخلي (٠–١٠٠) · اتركه فارغًا لغير المقيّم</label><input id="indicator-score" name="score" type="number" min="0" max="100" step="0.1" value="${a.score??''}"></div><div class="field"><label for="indicator-notes">مبررات التقدير وملاحظات التحقق</label><textarea id="indicator-notes" name="notes" maxlength="4000" placeholder="ما الذي تحقق؟ وما الذي يحتاج إلى تحسين؟">${esc(a.notes)}</textarea></div><div class="actions"><button class="btn primary" type="submit">حفظ التقييم</button>${button('إرفاق شاهد','upload','',`data-id="${id}"`)}</div></form><h3 style="margin-top:25px">الشواهد المرتبطة (${num(evidenceFor(id).length)})</h3>${evidenceFor(id).map(f=>`<div class="evidence-row"><span class="file-name">${esc(f.name)}</span>${tag(f.status==='verified'?'تم التحقق':'قيد المراجعة',f.status==='verified'?'':'amber')}<button class="link-btn" data-action="download-file" data-id="${f.id}">تنزيل</button></div>`).join('')||'<p class="muted">لا توجد شواهد. إضافة الشواهد لا تغيّر التقدير تلقائيًا.</p>'}<p class="audit">${a.date?'آخر تحديث: '+esc(new Date(a.date).toLocaleString('ar-SA')):''}</p>`)}
async function upload(id){const draft=$('#indicator-form');if($('#modal').open&&draft){if(!draft.reportValidity())return;const values=new FormData(draft);const score=String(values.get('score')||'').trim();state.answers[draft.dataset.id]={score:score===''?null:Number(score),notes:String(values.get('notes')||'').trim(),date:new Date().toISOString()};audit('حفظ التقييم قبل إرفاق الشاهد');await persist()}close();modal('إضافة شاهد',`<form id="upload-form"><div class="field"><label for="evidence-indicator">المؤشر المرتبط</label><select name="indicator" id="evidence-indicator">${eligible().map(i=>`<option value="${i.id}" ${id===i.id?'selected':''}>${i.id} · ${esc(i.text)}</option>`).join('')}</select></div><div class="field"><label for="evidence-file">ملف الشاهد · PDF أو صورة أو مستند مكتبي · حتى ١٠ م.ب</label><input id="evidence-file" name="file" type="file" required accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.txt,.csv,.ppt,.pptx"></div><div class="field"><label for="evidence-note">وصف الشاهد وما يثبته</label><textarea id="evidence-note" name="note" maxlength="1000"></textarea></div><button class="btn primary" type="submit">حفظ الشاهد على الجهاز</button></form>`)}
function taskForm(indicator='',editId=''){const t=state.tasks.find(t=>t.id===editId)||{},i=items.find(i=>i.id===indicator);modal(editId?'تعديل إجراء التحسين':'إجراء تحسين جديد',`<form id="task-form" data-id="${editId}"><div class="field"><label for="task-indicator">المؤشر المرتبط</label><select id="task-indicator" name="indicator"><option value="">إجراء عام للمدرسة</option>${eligible().map(x=>`<option value="${x.id}" ${(t.indicator||indicator)===x.id?'selected':''}>${x.id} · ${esc(x.standard)}</option>`).join('')}</select></div><div class="field"><label for="task-title">الإجراء التطويري</label><textarea id="task-title" name="title" required maxlength="1000">${esc(t.title||(i?'تحليل أسباب الفجوة وبناء إجراء لتحسين: '+i.text:''))}</textarea></div><div class="form-grid"><div class="field"><label for="task-owner">المسؤول عن التنفيذ</label><input id="task-owner" name="owner" required maxlength="100" value="${esc(t.owner||'')}"></div><div class="field"><label for="task-date">تاريخ الاستحقاق</label><input id="task-date" name="date" type="date" required value="${esc(t.date||'')}"></div><div class="field"><label for="task-proof">دليل الإنجاز المتوقع</label><input id="task-proof" name="proof" maxlength="500" value="${esc(t.proof||'')}"></div><div class="field"><label for="task-impact">مؤشر قياس الأثر</label><input id="task-impact" name="impact" maxlength="500" value="${esc(t.impact||'')}"></div></div><button class="btn primary" type="submit">حفظ الإجراء</button></form>`)}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function exportBackup(){const files=await Promise.all(evidence.map(async({blob,...f})=>({...f,data:await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})})));download(new Blob([JSON.stringify({kind:'miyar-backup',state,files},null,2)],{type:'application/json'}),'miyar-backup-'+today()+'.json');toast('تم تصدير البيانات والشواهد؛ احتفظ بالملف في مكان آمن')}
function importBackup(){modal('استيراد نسخة احتياطية',`<p class="muted">سيستبدل الاستيراد بيانات المدرسة والشواهد الحالية. صدّر نسخة أولًا إذا أردت الاحتفاظ بها.</p><form id="import-form"><div class="field"><label for="backup-file">ملف نسخة مِعْيَار الاحتياطية · حتى ١٠٠ م.ب</label><input id="backup-file" name="file" type="file" accept=".json" required></div><button type="submit" class="btn primary">استيراد واستبدال البيانات</button></form>`)}
async function replaceData(next,files=[]){const tx=db.transaction(['state','files'],'readwrite');tx.objectStore('state').put(next,'current');const store=tx.objectStore('files');store.clear();files.forEach(f=>store.put(f));await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});state=next;evidence=files;render()}
async function demo(){if((metrics().completed||state.tasks.length||evidence.length)&&!confirm('تحميل المثال يستبدل بياناتك الحالية وشواهدك. هل صدّرت نسخة احتياطية وتريد المتابعة؟'))return;const s=blank();s.demo=true;s.school.name='مدرسة آفاق المعرفة';s.school.manager='مدير المدرسة';items.forEach((i,n)=>{if(n<38)s.answers[i.id]={score:[82,68,91,76,55,88,64,79][n%8],notes:'تقدير افتراضي لعرض طريقة العمل، وليس نتيجة مدرسة حقيقية.',date:new Date().toISOString()}});s.team=[{id:uid(),name:'عبدالله أحمد',role:'مدير المدرسة / رئيس الفريق'},{id:uid(),name:'سارة محمد',role:'منسقة الجودة'}];s.steps={team:true,training:true,plan:true};s.tasks=[{id:uid(),indicator:'1-2-1-3',title:'تحليل أسباب الغياب وبناء برنامج لمتابعة الانضباط المدرسي',owner:'وكيل الشؤون الطلابية',date:today(),proof:'تقارير الحضور ومحاضر المتابعة',impact:'مقارنة نسبة الحضور قبل الإجراء وبعده',status:'doing'},{id:uid(),indicator:'1-4-1-5',title:'إعداد خطة التطوير المهني بناءً على احتياجات المعلمين',owner:'منسق التطوير المهني',date:today(),proof:'الخطة وسجل تنفيذ البرامج',impact:'تغير الممارسات الصفية وفق الملاحظة',status:'done'}];await replaceData(s);location.hash='dashboard';toast('تم تحميل مثال افتراضي، دون بيانات مدارس حقيقية')}
const actions={close,assess:()=>location.hash='assessment',settings:()=>location.hash='settings',sources:()=>location.hash='sources',report:()=>location.hash='reports',print:()=>window.print(),'edit-indicator':editIndicator,upload,'add-task':id=>taskForm(id),'edit-task':id=>taskForm('',id),'download-file':id=>{const f=evidence.find(f=>f.id===id);download(f.blob,f.name)},'delete-file':async id=>{if(!confirm('حذف الشاهد نهائيًا من هذا المتصفح؟'))return;await fileMutation(s=>s.delete(id));audit('حذف شاهد');await persist();render();toast('تم حذف الشاهد')},'review-file':id=>{const f=evidence.find(f=>f.id===id);modal('مراجعة شاهد',`<p>${esc(f.name)}</p><form id="review-form" data-id="${id}"><div class="field"><label for="review-status">قرار المراجعة المحلي</label><select id="review-status" name="status"><option value="pending" ${f.status==='pending'?'selected':''}>بانتظار المراجعة</option><option value="verified" ${f.status==='verified'?'selected':''}>تم التحقق محليًا</option><option value="rejected" ${f.status==='rejected'?'selected':''}>يحتاج استكمالًا</option></select></div><div class="field"><label for="review-note">ملاحظات المراجعة</label><textarea id="review-note" name="note" maxlength="1000">${esc(f.note)}</textarea></div><button type="submit" class="btn primary">حفظ المراجعة</button></form>`)},'delete-task':async id=>{if(!confirm('حذف إجراء التحسين؟'))return;state.tasks=state.tasks.filter(t=>t.id!==id);audit('حذف إجراء تحسين');await persist();render()},'add-member':()=>modal('إضافة عضو في فريق التقويم',`<form id="member-form"><div class="field"><label for="member-name">الاسم</label><input id="member-name" name="name" required maxlength="100"></div><div class="field"><label for="member-role">الدور والمسؤولية</label><input id="member-role" name="role" required maxlength="150" placeholder="مثال: معلم / جمع وتحليل الشواهد"></div><button type="submit" class="btn primary">إضافة عضو</button></form>`),'delete-member':async id=>{if(!confirm('حذف عضو الفريق؟'))return;state.team=state.team.filter(m=>m.id!==id);audit('حذف عضو فريق');await persist();render()},export:exportBackup,import:importBackup,demo,reset:async()=>{if(!confirm('بدء مدرسة جديدة يمسح جميع البيانات والشواهد المحلية. صدّر نسخة أولًا. هل تريد المتابعة؟'))return;await replaceData(blank());location.hash='settings';toast('مساحة جديدة جاهزة لبيانات مدرستك')},snapshot:()=>{const m=metrics();if(!m.complete){toast('يلزم تقييم جميع المؤشرات المنطبقة قبل حفظ لقطة الدورة');return}modal('حفظ لقطة دورة',`<form id="snapshot-form"><div class="field"><label for="cycle-name">اسم الدورة</label><input id="cycle-name" name="name" required maxlength="100" placeholder="التقييم الأول – الفصل الدراسي الأول"></div><p class="muted">تُحفظ نسخة من التقديرات والإطار الحالي. هذه لقطة داخلية وليست اعتمادًا رسميًا.</p><button class="btn primary" type="submit">حفظ لقطة النتائج</button></form>`)},'launch-info':()=>modal('تفعيل الاشتراكات: المرحلة التالية',`<p>الباقات المعروضة تصور تسعير فقط. لتقديم الخدمة للمدارس يلزم:</p><ol><li>خادم وقاعدة بيانات تعزل بيانات كل مدرسة.</li><li>حسابات وأدوار ودعوات ومراجعة مستقلة للشواهد.</li><li>بوابة دفع وإشعارات دفع موثقة وتفعيل الاشتراك من الخادم.</li><li>استضافة ونسخ احتياطية وسياسة خصوصية واختبارات أمنية.</li></ol><p class="muted">خطة تفصيلية موجودة في ملف SAAS-PLAN.md داخل المشروع.</p>`)};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;try{await actions[el.dataset.action]?.(el.dataset.id||'')}catch(error){toast('تعذر إكمال العملية: '+error.message);console.error(error)}});

 if(form.id==='member-form'){state.team.push({id:uid(),name:get('name'),role:get('role')});audit('إضافة عضو فريق');await persist();close();render();toast('أُضيف عضو الفريق')}
 if(form.id==='upload-form'){const f=data.get('file');if(!f.size||f.size>10*1024*1024)throw Error('حجم الملف يجب أن يكون أكبر من صفر وأقل من ١٠ م.ب');if(!/\.(pdf|png|jpe?g|webp|docx?|xlsx?|txt|csv|pptx?)$/i.test(f.name))throw Error('نوع الملف غير مدعوم');const file={id:uid(),indicator:get('indicator'),name:f.name,size:f.size,type:f.type,date:today(),status:'pending',note:get('note'),blob:f};await fileMutation(s=>s.put(file));audit('إرفاق شاهد للمؤشر '+file.indicator);await persist();close();render();toast('حُفظ ملف الشاهد على هذا الجهاز')}
 if(form.id==='review-form'){const f=evidence.find(f=>f.id===form.dataset.id);await fileMutation(s=>s.put({...f,status:get('status'),note:get('note')}));audit('تسجيل مراجعة شاهد');await persist();close();render();toast('حُفظ قرار المراجعة المحلي')}
 if(form.id==='snapshot-form'){const m=metrics();state.cycles.push({id:uid(),name:get('name'),date:today(),score:m.score,total:m.total,school:structuredClone(state.school),answers:structuredClone(state.answers),method:'simple-indicator-average-v1',framework:'ETEC-2026-v2'});audit('حفظ لقطة دورة');await persist();close();render();toast('حُفظت لقطة الدورة')}
 if(form.id==='import-form'){const f=data.get('file');if(f.size>100*1024*1024)throw Error('النسخة أكبر من ١٠٠ م.ب');const backup=JSON.parse(await f.text());if(backup.kind!=='miyar-backup'||!Array.isArray(backup.files))throw Error('ليست نسخة احتياطية من مِعْيَار');validateState(backup.state,items);if(!backup.state.steps||!Array.isArray(backup.state.audit))throw Error('بيانات غير مكتملة');const files=await Promise.all(backup.files.map(async f=>{if(typeof f.data!=='string'||!/^data:[^,]*;base64,/.test(f.data)||typeof f.name!=='string'||typeof f.id!=='string'||!items.some(i=>i.id===f.indicator)||!['pending','verified','rejected'].includes(f.status))throw Error('شاهد غير صالح');const blob=await(await fetch(f.data)).blob();if(blob.size>10*1024*1024)throw Error('ملف شاهد يتجاوز الحد');const {data,...rest}=f;return {...rest,blob}}));await replaceData(backup.state,files);close();toast('تم استيراد البيانات والشواهد')}
